# =====================================================
# go-e Gemini – PV-Überschussladen über Home Assistant
# ohne ha-goecharger-api2 Integration, nur lokale HTTP API v2
#
# Einbinden als Package (configuration.yaml):
#   homeassistant:
#     packages:
#       goe: !include goe_gemini_pv_ueberschuss.yaml
#
# Benötigt Home Assistant 2024.10 oder neuer
# (Syntax triggers/conditions/actions).
#
# Wallbox-IP: 192.168.178.56  -> kommt genau 2x vor
#             (rest_command.goe_set und rest-Sensor)
# Sensoren:   sensor.inverter_grid_power
#               negativ = Einspeisung, positiv = Bezug
#             sensor.inverter_battery          SoC des Speichers in %
#             sensor.inverter_battery_power
#               positiv = Speicher lädt, negativ = entlädt
#
# Modi (input_select.wallbox_modus):
#   Aus      -> Wallbox freigegeben, lädt normal mit Max Ampere
#   Speicher -> 7 A dreiphasig aus dem Speicher,
#               Stopp bei 30 % SoC, Neustart ab 50 %
#   PV       -> Überschussladen, Speicher hat Vorrang.
#               Ab 80 % SoC feste Leistung 6 A dreiphasig,
#               Speicher gleicht bis 2 kW aus (siehe 6.1)
#
# Alle Grenzen stehen gesammelt am Anfang der
# Hauptregelung (Abschnitt 6.1).
# =====================================================

# =====================================================
# 1. Helfer
# =====================================================
input_select:
  wallbox_modus:
    name: Wallbox Modus
    options:
      - Aus
      - Speicher
      - PV
    icon: mdi:ev-station

input_boolean:
  # Wird von der Regelung gesetzt, nur zur Anzeige:
  # an = PV-Modus lädt gerade mit fester Leistung
  wallbox_festleistung:
    name: Wallbox Festleistung aktiv
    icon: mdi:battery-arrow-down

input_number:
  wallbox_max_ampere:
    name: Wallbox Max Ampere
    min: 6
    max: 16
    step: 1
    unit_of_measurement: A
    icon: mdi:current-ac

  # Wird vom Überschuss abgezogen und bleibt als Einspeisung übrig.
  # Wert in der Oberfläche einstellen (Einstellungen -> Helfer).
  wallbox_reserve:
    name: Wallbox Reserve (Puffer)
    min: 0
    max: 1000
    step: 50
    unit_of_measurement: W
    icon: mdi:shield-outline

# Sperrzeit nach einem Phasenwechsel – verhindert Pendeln bei Wolken
timer:
  wallbox_phasensperre:
    name: Wallbox Phasensperre
    duration: "00:05:00"
    restore: true

# =====================================================
# 2. REST-Befehl (Schreiben)
#    Ein einziger Befehl für alle Parameter, z. B.
#      query: "amp=10"   Ladestrom in A
#      query: "psm=2"    1 = einphasig, 2 = dreiphasig
#      query: "frc=1"    0 = neutral, 1 = gesperrt, 2 = erzwungen
# =====================================================
rest_command:
  goe_set:
    url: "http://192.168.178.56/api/set?{{ query }}"
    method: GET
    timeout: 10

# =====================================================
# 3. REST-Sensoren (Lesen)
# =====================================================
rest:
  - resource: "http://192.168.178.56/api/status?filter=nrg,psm,amp,frc,car"
    scan_interval: 10
    timeout: 5
    sensor:
      # nrg[11] = Gesamtleistung in W (API v2)
      - name: "goe Ladeleistung"
        unique_id: goe_ladeleistung
        value_template: "{{ value_json.nrg[11] | float(0) | round(0) }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement

      # 1 = einphasig, 2 = dreiphasig
      - name: "goe Phasenmodus"
        unique_id: goe_phasenmodus
        value_template: "{{ value_json.psm | int(0) }}"

      - name: "goe Ladestrom Soll"
        unique_id: goe_ladestrom_soll
        value_template: "{{ value_json.amp | int(0) }}"
        unit_of_measurement: A

      # 0 = neutral, 1 = gesperrt, 2 = erzwungen
      - name: "goe Force State"
        unique_id: goe_force_state
        value_template: "{{ value_json.frc | int(0) }}"

      # 1 = kein Auto, 2 = lädt, 3 = wartet auf Auto, 4 = beendet, 5 = Fehler
      - name: "goe Fahrzeugstatus"
        unique_id: goe_fahrzeugstatus
        value_template: "{{ value_json.car | int(0) }}"

# =====================================================
# 4. Berechneter Überschuss
#    Die bereits fließende Ladeleistung wird wieder
#    hinzugerechnet, sonst regelt sich die Automation tot.
# =====================================================
template:
  - sensor:
      # Überschuss für das gleitende Laden, Speicher hat Vorrang:
      # - Speicher lädt  -> zählt NICHT als Überschuss
      # - Speicher entlädt (deckt das Auto) -> wird abgezogen,
      #   sonst hält der Wechselrichter das Netz auf 0 W und die
      #   Regelung hielte Speicherstrom für PV-Überschuss.
      - name: "PV Ueberschuss"
        unique_id: pv_ueberschuss_roh
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >
          {{ states('sensor.inverter_grid_power') | is_number
             and states('sensor.goe_ladeleistung') | is_number }}
        state: >
          {% set grid    = states('sensor.inverter_grid_power')    | float(0) %}
          {% set laden   = states('sensor.goe_ladeleistung')       | float(0) %}
          {% set batt    = states('sensor.inverter_battery_power') | float(0) %}
          {% set reserve = states('input_number.wallbox_reserve')  | float(100) %}
          {{ (laden - grid + [batt, 0] | min - reserve) | round(0) }}

      # Gesamter PV-Überschuss inkl. Speicher-Ladeleistung
      # (= PV minus Hausverbrauch). Entscheidet, ob genug PV
      # für die feste Leistung ab 80 % SoC da ist.
      - name: "PV Ueberschuss gesamt"
        unique_id: pv_ueberschuss_gesamt
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >
          {{ states('sensor.inverter_grid_power') | is_number
             and states('sensor.goe_ladeleistung') | is_number
             and states('sensor.inverter_battery_power') | is_number }}
        state: >
          {% set grid    = states('sensor.inverter_grid_power')    | float(0) %}
          {% set laden   = states('sensor.goe_ladeleistung')       | float(0) %}
          {% set batt    = states('sensor.inverter_battery_power') | float(0) %}
          {% set reserve = states('input_number.wallbox_reserve')  | float(100) %}
          {{ (laden - grid + batt - reserve) | round(0) }}

sensor:
  # Glättung über 2 Minuten – keine Reaktion auf jede Wolke
  - platform: statistics
    name: "PV Ueberschuss geglaettet"
    unique_id: pv_ueberschuss_geglaettet
    entity_id: sensor.pv_ueberschuss
    state_characteristic: mean
    sampling_size: 60
    max_age:
      minutes: 2

  # 5-Minuten-Mittel für die Umschaltung feste Leistung <-> gleitend
  - platform: statistics
    name: "PV Ueberschuss gesamt 5min"
    unique_id: pv_ueberschuss_gesamt_5min
    entity_id: sensor.pv_ueberschuss_gesamt
    state_characteristic: mean
    sampling_size: 300
    max_age:
      minutes: 5

  - platform: statistics
    name: "Speicher Leistung 5min"
    unique_id: speicher_leistung_5min
    entity_id: sensor.inverter_battery_power
    state_characteristic: mean
    sampling_size: 300
    max_age:
      minutes: 5

# =====================================================
# 5. Script: sicherer Phasenwechsel
#    Laden stoppen -> Phasen umschalten -> Strom setzen
#    -> Laden starten -> Sperrzeit starten
# =====================================================
script:
  goe_phasenwechsel:
    alias: go-e sicherer Phasenwechsel
    mode: single
    fields:
      phase:
        description: "1 = einphasig, 2 = dreiphasig"
        example: 1
      amps:
        description: "Ladestrom in A nach dem Wechsel"
        example: 10
    sequence:
      - action: rest_command.goe_set
        data:
          query: "frc=1"
      - delay: "00:00:05"
      - action: rest_command.goe_set
        data:
          query: "psm={{ phase | int }}"
      - delay: "00:00:05"
      - action: rest_command.goe_set
        data:
          query: "amp={{ amps | int }}"
      - delay: "00:00:02"
      - action: rest_command.goe_set
        data:
          query: "frc=2"
      - action: timer.start
        target:
          entity_id: timer.wallbox_phasensperre

# =====================================================
# 6. Automationen
# =====================================================
automation:
  # ---------------------------------------------------
  # 6.1 Hauptregelung (alle 30 s und bei Moduswechsel)
  # ---------------------------------------------------
  - id: goe_pv_regelung
    alias: go-e PV-Regelung
    description: Speicher- und PV-Laden, vollständig durch Home Assistant gesteuert
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        seconds: "/30"
        id: takt
      - trigger: state
        entity_id: input_select.wallbox_modus
        to:
          - Speicher
          - PV
        id: modus
    conditions:
      - condition: template
        value_template: >
          {{ states('input_select.wallbox_modus') in ['Speicher', 'PV'] }}
      - condition: template
        value_template: >
          {{ states('sensor.pv_ueberschuss_geglaettet') | is_number
             and states('sensor.goe_phasenmodus') | is_number }}
      # 1 = kein Auto angeschlossen -> nichts zu tun
      - condition: template
        value_template: "{{ states('sensor.goe_fahrzeugstatus') | int(1) != 1 }}"
    actions:
      - variables:
          # --- Grenzen: gleitendes Überschussladen (W, nach Reserve) ---
          aus_unter: 1300            # Laden stoppen
          ein_ab: 1400               # Laden wieder starten
          dreiphasig_ab: 4400        # Wechsel 1ph -> 3ph
          einphasig_unter: 4000      # Wechsel 3ph -> 1ph

          # --- Grenzen: Speicher-Modus ---
          speicher_amp: 7            # 7 A dreiphasig ≈ 4,8 kW
          speicher_stopp_soc: 30     # Stopp bei <= 30 %
          speicher_start_soc: 50     # Neustart ab 50 %

          # --- Grenzen: PV-Modus mit fester Leistung ---
          fest_amp: 6                # 6 A dreiphasig ≈ 4,1 kW
          fest_ab_soc: 80            # feste Leistung ab 80 %
          fest_aus_unter_soc: 50     # zurück auf gleitend unter 50 %
          fest_max_speicher: 2000    # Speicher gibt im 5-min-Mittel max. 2 kW ab
          fest_zurueck_ab: 2500      # wieder fest ab 2,5 kW Überschuss (5-min-Mittel)

          # --- Istwerte ---
          modus: "{{ states('input_select.wallbox_modus') }}"
          soc: "{{ states('sensor.inverter_battery') | float(0) }}"
          speicher_5min: "{{ states('sensor.speicher_leistung_5min') | float(0) }}"
          pv_gesamt_5min: "{{ states('sensor.pv_ueberschuss_gesamt_5min') | float(0) }}"
          verfuegbar: "{{ states('sensor.pv_ueberschuss_geglaettet') | float(0) }}"
          laden: "{{ states('sensor.goe_ladeleistung') | float(0) }}"
          max_amp: "{{ states('input_number.wallbox_max_ampere') | int(16) }}"
          psm_ist: "{{ states('sensor.goe_phasenmodus') | int(1) }}"
          amp_ist: "{{ states('sensor.goe_ladestrom_soll') | int(0) }}"
          frc_ist: "{{ states('sensor.goe_force_state') | int(0) }}"
          gesperrt: "{{ is_state('timer.wallbox_phasensperre', 'active') }}"
          fest_ist: "{{ is_state('input_boolean.wallbox_festleistung', 'on') }}"

          # --- Speicher-Modus: Freigabe mit Hysterese 30 % / 50 % ---
          # Beim Wählen des Modus reicht > 30 %, danach entscheidet,
          # ob die Wallbox gerade lädt (frc 2) oder gestoppt ist (frc 1).
          speicher_frei: >
            {% if trigger.id == 'modus' or frc_ist != 1 %}
              {{ soc > speicher_stopp_soc }}
            {% else %}
              {{ soc >= speicher_start_soc }}
            {% endif %}

          # --- PV-Modus: feste Leistung an/aus ---
          # an:  SoC >= 80 % und 5 min im Mittel >= 2,5 kW Überschuss
          # aus: SoC < 50 % oder Speicher gibt 5 min im Mittel > 2 kW ab
          fest_pv: >
            {% if modus != 'PV' %}
              false
            {% elif fest_ist %}
              {{ soc >= fest_aus_unter_soc and speicher_5min >= -fest_max_speicher }}
            {% else %}
              {{ soc >= fest_ab_soc and pv_gesamt_5min >= fest_zurueck_ab }}
            {% endif %}

          # --- Was ist zu tun? ---
          fest: "{{ (modus == 'Speicher' and speicher_frei) or fest_pv }}"
          stopp: >
            {{ (modus == 'Speicher' and not speicher_frei)
               or (modus == 'PV' and not fest and verfuegbar < aus_unter) }}
          warten: >
            {{ modus == 'PV' and not fest and frc_ist == 1 and verfuegbar < ein_ab }}

          # --- Phasen: fest immer dreiphasig, sonst Hysterese + Sperrzeit ---
          ziel_psm: >
            {% if fest %}
              2
            {% elif gesperrt %}
              {{ psm_ist }}
            {% elif psm_ist == 2 %}
              {{ 2 if verfuegbar >= einphasig_unter else 1 }}
            {% else %}
              {{ 2 if verfuegbar >= dreiphasig_ab else 1 }}
            {% endif %}

          # --- Watt pro Ampere ---
          # Während der Ladung aus der Messung (Netzspannung, Auto
          # nimmt evtl. etwas weniger als freigegeben), sonst 230 V.
          # Begrenzt auf 180–240 W pro Phase gegen Ausreißer.
          w_pro_a: >
            {% set ph = 1 if ziel_psm | int == 1 else 3 %}
            {% if amp_ist >= 6 and laden > 500 and ziel_psm | int == psm_ist %}
              {% set w = laden / amp_ist %}
            {% else %}
              {% set w = 230 * ph %}
            {% endif %}
            {{ [[w, 180 * ph] | max, 240 * ph] | min }}

          ziel_amp: >
            {% if fest %}
              {{ [speicher_amp if modus == 'Speicher' else fest_amp, max_amp] | min }}
            {% else %}
              {{ [[ (verfuegbar / w_pro_a) | int(0), 6 ] | max, max_amp ] | min }}
            {% endif %}

      # Anzeige-Helfer nachführen
      - if: "{{ fest_pv and not fest_ist }}"
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.wallbox_festleistung
      - if: "{{ fest_ist and not fest_pv }}"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.wallbox_festleistung

      - choose:
          # --- Laden stoppen ---
          - conditions: "{{ stopp }}"
            sequence:
              - if: "{{ frc_ist != 1 }}"
                then:
                  - action: rest_command.goe_set
                    data:
                      query: "frc=1"

          # --- Gestoppt und noch unter der Einschaltschwelle: warten ---
          - conditions: "{{ warten }}"
            sequence: []

          # --- Phasenwechsel nötig ---
          - conditions: "{{ ziel_psm | int != psm_ist }}"
            sequence:
              - action: script.goe_phasenwechsel
                data:
                  phase: "{{ ziel_psm | int }}"
                  amps: "{{ ziel_amp | int }}"

        # --- Laden: nur nachregeln, was sich geändert hat ---
        default:
          - if: "{{ ziel_amp | int != amp_ist }}"
            then:
              - action: rest_command.goe_set
                data:
                  query: "amp={{ ziel_amp | int }}"
          - if: "{{ frc_ist != 2 }}"
            then:
              - action: rest_command.goe_set
                data:
                  query: "frc=2"

  # ---------------------------------------------------
  # 6.2 Modus „Aus“ -> Wallbox freigeben
  # ---------------------------------------------------
  - id: goe_pv_steuerung_aus
    alias: go-e Modus Aus
    mode: single
    triggers:
      - trigger: state
        entity_id: input_select.wallbox_modus
        to: Aus
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.wallbox_festleistung
      - action: rest_command.goe_set
        data:
          query: "amp={{ states('input_number.wallbox_max_ampere') | int(16) }}"
      # frc 0 = neutral: Wallbox entscheidet wieder selbst
      - action: rest_command.goe_set
        data:
          query: "frc=0"

  # ---------------------------------------------------
  # 6.3 Beim HA-Start: interne ECO-/PV-Logik der Wallbox
  #     abschalten (Basic-Modus, kein eigenes PV-Laden)
  # ---------------------------------------------------
  - id: goe_modus_setzen
    alias: go-e Basic-Modus erzwingen
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - delay: "00:00:30"
      - action: rest_command.goe_set
        data:
          query: "lmo=3&fup=false"

# =====================================================
# Grenzen im Überblick
# -----------------------------------------------------
# PV, gleitend (Überschuss am Netz nach Reserve):
#   < 1300 W          -> Laden stoppen
#   1300 – 1400 W     -> Totband (kein Wiedereinschalten)
#   >= 1400 W         -> einphasig laden (6 – 16 A)
#   >= 4400 W         -> Wechsel auf dreiphasig
#   < 4000 W (in 3ph) -> zurück auf einphasig
#   Nach jedem Phasenwechsel: 5 Minuten Sperrzeit
#
# PV, feste Leistung 6 A dreiphasig (≈ 4,1 kW):
#   an:  SoC >= 80 % UND Überschuss inkl. Speicher
#        5 min im Mittel >= 2500 W
#   aus: SoC < 50 % ODER Speicher gibt 5 min im Mittel
#        mehr als 2000 W ab -> zurück auf gleitend
#
# Speicher, 7 A dreiphasig (≈ 4,8 kW):
#   Stopp bei <= 30 % SoC, Neustart ab 50 %
# =====================================================

# =====================================================
# go-e Gemini – PV-Überschussladen über Home Assistant
# ohne ha-goecharger-api2 Integration, nur lokale HTTP API v2
#
# Einbinden als Package (configuration.yaml):
#   homeassistant:
#     packages:
#       goe: !include goe_gemini_pv_ueberschuss.yaml
#
# Benötigt Home Assistant 2024.10 oder neuer
# (Syntax triggers/conditions/actions).
#
# Wallbox-IP: 192.168.178.56  -> kommt genau 2x vor
#             (rest_command.goe_set und rest-Sensor)
# Netzsensor: sensor.inverter_grid_power
#             negativ = Einspeisung, positiv = Bezug
#
# Alle Schaltschwellen stehen gesammelt am Anfang der
# Hauptregelung (Abschnitt 6.1).
# =====================================================

# =====================================================
# 1. Helfer
# =====================================================
input_boolean:
  wallbox_pv_steuerung:
    name: Wallbox PV Steuerung
    icon: mdi:solar-power

input_number:
  wallbox_max_ampere:
    name: Wallbox Max Ampere
    min: 6
    max: 16
    step: 1
    unit_of_measurement: A
    icon: mdi:current-ac

  # Wird vom Überschuss abgezogen und bleibt als Einspeisung übrig.
  # Wert in der Oberfläche einstellen (Einstellungen -> Helfer).
  wallbox_reserve:
    name: Wallbox Reserve (Puffer)
    min: 0
    max: 1000
    step: 50
    unit_of_measurement: W
    icon: mdi:shield-outline

# Sperrzeit nach einem Phasenwechsel – verhindert Pendeln bei Wolken
timer:
  wallbox_phasensperre:
    name: Wallbox Phasensperre
    duration: "00:05:00"
    restore: true

# =====================================================
# 2. REST-Befehl (Schreiben)
#    Ein einziger Befehl für alle Parameter, z. B.
#      query: "amp=10"   Ladestrom in A
#      query: "psm=2"    1 = einphasig, 2 = dreiphasig
#      query: "frc=1"    0 = neutral, 1 = gesperrt, 2 = erzwungen
# =====================================================
rest_command:
  goe_set:
    url: "http://192.168.178.56/api/set?{{ query }}"
    method: GET
    timeout: 10

# =====================================================
# 3. REST-Sensoren (Lesen)
# =====================================================
rest:
  - resource: "http://192.168.178.56/api/status?filter=nrg,psm,amp,frc,car"
    scan_interval: 10
    timeout: 5
    sensor:
      # nrg[11] = Gesamtleistung in W (API v2)
      - name: "goe Ladeleistung"
        unique_id: goe_ladeleistung
        value_template: "{{ value_json.nrg[11] | float(0) | round(0) }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement

      # 1 = einphasig, 2 = dreiphasig
      - name: "goe Phasenmodus"
        unique_id: goe_phasenmodus
        value_template: "{{ value_json.psm | int(0) }}"

      - name: "goe Ladestrom Soll"
        unique_id: goe_ladestrom_soll
        value_template: "{{ value_json.amp | int(0) }}"
        unit_of_measurement: A

      # 0 = neutral, 1 = gesperrt, 2 = erzwungen
      - name: "goe Force State"
        unique_id: goe_force_state
        value_template: "{{ value_json.frc | int(0) }}"

      # 1 = kein Auto, 2 = lädt, 3 = wartet auf Auto, 4 = beendet, 5 = Fehler
      - name: "goe Fahrzeugstatus"
        unique_id: goe_fahrzeugstatus
        value_template: "{{ value_json.car | int(0) }}"

# =====================================================
# 4. Berechneter Überschuss
#    Die bereits fließende Ladeleistung wird wieder
#    hinzugerechnet, sonst regelt sich die Automation tot.
# =====================================================
template:
  - sensor:
      - name: "PV Ueberschuss"
        unique_id: pv_ueberschuss_roh
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >
          {{ states('sensor.inverter_grid_power') | is_number
             and states('sensor.goe_ladeleistung') | is_number }}
        state: >
          {% set grid    = states('sensor.inverter_grid_power')   | float(0) %}
          {% set laden   = states('sensor.goe_ladeleistung')      | float(0) %}
          {% set reserve = states('input_number.wallbox_reserve') | float(100) %}
          {{ (laden - grid - reserve) | round(0) }}

# Glättung über 2 Minuten – keine Reaktion auf jede Wolke
sensor:
  - platform: statistics
    name: "PV Ueberschuss geglaettet"
    unique_id: pv_ueberschuss_geglaettet
    entity_id: sensor.pv_ueberschuss
    state_characteristic: mean
    sampling_size: 60
    max_age:
      minutes: 2

# =====================================================
# 5. Script: sicherer Phasenwechsel
#    Laden stoppen -> Phasen umschalten -> Strom setzen
#    -> Laden starten -> Sperrzeit starten
# =====================================================
script:
  goe_phasenwechsel:
    alias: go-e sicherer Phasenwechsel
    mode: single
    fields:
      phase:
        description: "1 = einphasig, 2 = dreiphasig"
        example: 1
      amps:
        description: "Ladestrom in A nach dem Wechsel"
        example: 10
    sequence:
      - action: rest_command.goe_set
        data:
          query: "frc=1"
      - delay: "00:00:05"
      - action: rest_command.goe_set
        data:
          query: "psm={{ phase | int }}"
      - delay: "00:00:05"
      - action: rest_command.goe_set
        data:
          query: "amp={{ amps | int }}"
      - delay: "00:00:02"
      - action: rest_command.goe_set
        data:
          query: "frc=2"
      - action: timer.start
        target:
          entity_id: timer.wallbox_phasensperre

# =====================================================
# 6. Automationen
# =====================================================
automation:
  # ---------------------------------------------------
  # 6.1 Hauptregelung (alle 30 s)
  # ---------------------------------------------------
  - id: goe_pv_regelung
    alias: go-e PV-Regelung
    description: PV-Überschussladen, vollständig durch Home Assistant gesteuert
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        seconds: "/30"
    conditions:
      - condition: state
        entity_id: input_boolean.wallbox_pv_steuerung
        state: "on"
      - condition: template
        value_template: >
          {{ states('sensor.pv_ueberschuss_geglaettet') | is_number
             and states('sensor.goe_phasenmodus') | is_number }}
      # 1 = kein Auto angeschlossen -> nichts zu tun
      - condition: template
        value_template: "{{ states('sensor.goe_fahrzeugstatus') | int(1) != 1 }}"
    actions:
      - variables:
          # --- Schaltschwellen (W, nach Abzug der Reserve) ---
          aus_unter: 1300          # Laden stoppen
          ein_ab: 1400             # Laden wieder starten
          dreiphasig_ab: 4400      # Wechsel 1ph -> 3ph
          einphasig_unter: 4000    # Wechsel 3ph -> 1ph

          # --- Istwerte ---
          verfuegbar: "{{ states('sensor.pv_ueberschuss_geglaettet') | float(0) }}"
          laden: "{{ states('sensor.goe_ladeleistung') | float(0) }}"
          max_amp: "{{ states('input_number.wallbox_max_ampere') | int(16) }}"
          psm_ist: "{{ states('sensor.goe_phasenmodus') | int(1) }}"
          amp_ist: "{{ states('sensor.goe_ladestrom_soll') | int(0) }}"
          frc_ist: "{{ states('sensor.goe_force_state') | int(0) }}"
          gesperrt: "{{ is_state('timer.wallbox_phasensperre', 'active') }}"

          # --- Phasenwahl mit Hysterese, während der Sperrzeit unverändert ---
          ziel_psm: >
            {% if gesperrt %}
              {{ psm_ist }}
            {% elif psm_ist == 2 %}
              {{ 2 if verfuegbar >= einphasig_unter else 1 }}
            {% else %}
              {{ 2 if verfuegbar >= dreiphasig_ab else 1 }}
            {% endif %}

          # --- Watt pro Ampere ---
          # Während der Ladung aus der Messung (Netzspannung, Auto
          # nimmt evtl. etwas weniger als freigegeben), sonst 230 V.
          # Begrenzt auf 180–240 W pro Phase gegen Ausreißer.
          w_pro_a: >
            {% set ph = 1 if ziel_psm | int == 1 else 3 %}
            {% if amp_ist >= 6 and laden > 500 and ziel_psm | int == psm_ist %}
              {% set w = laden / amp_ist %}
            {% else %}
              {% set w = 230 * ph %}
            {% endif %}
            {{ [[w, 180 * ph] | max, 240 * ph] | min }}

          ziel_amp: >
            {{ [[ (verfuegbar / w_pro_a) | int(0), 6 ] | max, max_amp ] | min }}

      - choose:
          # --- Zu wenig Überschuss: Laden stoppen ---
          - conditions: "{{ verfuegbar < aus_unter }}"
            sequence:
              - if: "{{ frc_ist != 1 }}"
                then:
                  - action: rest_command.goe_set
                    data:
                      query: "frc=1"

          # --- Gesperrt und noch unter der Einschaltschwelle: warten ---
          - conditions: "{{ frc_ist == 1 and verfuegbar < ein_ab }}"
            sequence: []

          # --- Phasenwechsel nötig ---
          - conditions: "{{ ziel_psm | int != psm_ist }}"
            sequence:
              - action: script.goe_phasenwechsel
                data:
                  phase: "{{ ziel_psm | int }}"
                  amps: "{{ ziel_amp | int }}"

        # --- Normalbetrieb: nur nachregeln, was sich geändert hat ---
        default:
          - if: "{{ ziel_amp | int != amp_ist }}"
            then:
              - action: rest_command.goe_set
                data:
                  query: "amp={{ ziel_amp | int }}"
          - if: "{{ frc_ist != 2 }}"
            then:
              - action: rest_command.goe_set
                data:
                  query: "frc=2"

  # ---------------------------------------------------
  # 6.2 Steuerung ausgeschaltet -> Wallbox freigeben
  # ---------------------------------------------------
  - id: goe_pv_steuerung_aus
    alias: go-e PV-Steuerung ausgeschaltet
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.wallbox_pv_steuerung
        to: "off"
    actions:
      - action: rest_command.goe_set
        data:
          query: "amp={{ states('input_number.wallbox_max_ampere') | int(16) }}"
      # frc 0 = neutral: Wallbox entscheidet wieder selbst
      - action: rest_command.goe_set
        data:
          query: "frc=0"

  # ---------------------------------------------------
  # 6.3 Beim HA-Start: interne ECO-/PV-Logik der Wallbox
  #     abschalten (Basic-Modus, kein eigenes PV-Laden)
  # ---------------------------------------------------
  - id: goe_modus_setzen
    alias: go-e Basic-Modus erzwingen
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - delay: "00:00:30"
      - action: rest_command.goe_set
        data:
          query: "lmo=3&fup=false"

# =====================================================
# Schaltschwellen im Überblick (Überschuss nach Reserve)
# -----------------------------------------------------
#   < 1300 W          -> Laden stoppen
#   1300 – 1400 W     -> Totband (kein Wiedereinschalten)
#   >= 1400 W         -> einphasig laden (6 – 16 A)
#   >= 4400 W         -> Wechsel auf dreiphasig
#   < 4000 W (in 3ph) -> zurück auf einphasig
#   Nach jedem Phasenwechsel: 5 Minuten Sperrzeit
#
# Tatsächliche Einspeisung = Schwelle + Reserve
# (z. B. Start bei 1400 W + 50 W Reserve = 1450 W)
# =====================================================
